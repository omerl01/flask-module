<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <section class="form-section">
            <h3>Create New List</h3>
            <div class="input-group">
                <input type="text" id="listName" placeholder="Work, Groceries, etc.">
                <button onclick="createList()">Add List</button>
            </div>
        </section>

        <section class="form-section">
            <h3>Add Task</h3>
            <div class="input-group">
                <input type="text" id="taskTitle" placeholder="Task description">
                <select id="listSelect">
                    <option value="">No List</option>
                </select>
                <button onclick="createTask()">Add Task</button>
            </div>
        </section>

        <hr>

        <div id="display-area">
            <div class="column">
                <h2>Lists</h2>
                <ul id="lists-container"></ul>
            </div>
            <div class="column">
                <h2>Tasks</h2>
                <ul id="tasks-container"></ul>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalHeader">Edit Item</h3>
            <input type="hidden" id="editId">
            <input type="hidden" id="editCollection">
            <input type="text" id="editInput" style="width: 100%; margin-bottom: 10px;">
            <div id="listMoveSection" style="display:none;">
                <label>Move to List:</label>
                <select id="editListSelect" style="width: 100%; margin-bottom: 10px;"></select>
            </div>
            <button onclick="saveEdit()">Save Changes</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const API_BASE = ""; 

        async function fetchData(endpoint) {
            const res = await fetch(`${API_BASE}/${endpoint}`);
            return await res.json();
        }

        async function refresh() {
            const lists = await fetchData('lists');
            const tasks = await fetchData('tasks');

            const select = document.getElementById('listSelect');
            select.innerHTML = '<option value="">No List</option>';
            lists.forEach(l => select.innerHTML += `<option value="${l._id}">${l.name}</option>`);

            const listUl = document.getElementById('lists-container');
            listUl.innerHTML = '';
            lists.forEach(l => {
                listUl.innerHTML += `<li>
                    <span>${l.name}</span>
                    <div>
                        <button onclick="openModal('${l._id}', 'lists', '${l.name}')">✎</button>
                        <button onclick="deleteItem('${l._id}', 'lists')">×</button>
                    </div>
                </li>`;
            });

            const taskUl = document.getElementById('tasks-container');
            taskUl.innerHTML = '';
            tasks.forEach(t => {
                const listObj = lists.find(l => l._id === t.list);
                const listName = listObj ? listObj.name : 'General';
                
                taskUl.innerHTML += `
                    <li class="${t.completed ? 'completed' : ''}">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" 
                                ${t.completed ? 'checked' : ''} 
                                onclick="toggleTask('${t._id}', ${t.completed}, '${t.title}', '${t.list}')">
                            <div>
                                <strong>${t.title}</strong><br>
                                <small>List: ${listName}</small>
                            </div>
                        </div>
                        <div>
                            <button onclick="openModal('${t._id}', 'tasks', '${t.title}', '${t.list}')">✎</button>
                            <button onclick="deleteItem('${t._id}', 'tasks')">×</button>
                        </div>
                    </li>`;
            });
        }

        async function toggleTask(id, currentStatus, title, listId) {
            await fetch(`${API_BASE}/tasks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, list: listId, completed: !currentStatus })
            });
            refresh();
        }

        async function createList() {
            const name = document.getElementById('listName').value;
            await fetch(`${API_BASE}/lists`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            document.getElementById('listName').value = '';
            refresh();
        }

        async function createTask() {
            const title = document.getElementById('taskTitle').value;
            const listId = document.getElementById('listSelect').value;
            await fetch(`${API_BASE}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, list: listId, completed: false })
            });
            document.getElementById('taskTitle').value = '';
            refresh();
        }

        async function deleteItem(id, collection) {
            if (!confirm("Are you sure?")) return;
            await fetch(`${API_BASE}/${collection}/${id}`, { method: 'DELETE' });
            refresh();
        }

        function openModal(id, collection, currentVal, currentListId = "") {
            document.getElementById('editId').value = id;
            document.getElementById('editCollection').value = collection;
            document.getElementById('editInput').value = currentVal;
            
            const moveSection = document.getElementById('listMoveSection');
            if (collection === 'tasks') {
                moveSection.style.display = 'block';
                const mainSelect = document.getElementById('listSelect');
                const modalSelect = document.getElementById('editListSelect');
                modalSelect.innerHTML = mainSelect.innerHTML;
                modalSelect.value = currentListId;
            } else {
                moveSection.style.display = 'none';
            }
            
            // שינוי ל-flex כדי שהמירכוז מה-CSS יעבוד
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const collection = document.getElementById('editCollection').value;
            const newVal = document.getElementById('editInput').value;

            let payload = {};
            if (collection === 'lists') {
                payload = { name: newVal };
            } else {
                const newListId = document.getElementById('editListSelect').value;
                const tasks = await fetchData('tasks');
                const task = tasks.find(t => t._id === id);
                payload = { title: newVal, list: newListId, completed: task.completed };
            }

            await fetch(`${API_BASE}/${collection}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            closeModal();
            refresh();
        }

        refresh();
    </script>
</body>
</html>x
